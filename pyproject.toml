[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-chaining"
version = "1.0.0"
description = "Autonomous FSM Sub-Loop Tool Chaining & NetworkX Mesh for AI Agents"
readme = "README.md"
authors = [
    { name = "Serhii Kupriienko", email = "skupriienko@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.urls]
Homepage = "https://github.com/skupriienko/mcp-chaining"
Repository = "https://github.com/skupriienko/mcp-chaining.git"

[project.scripts]
mcp-chain = "mcp_chaining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
